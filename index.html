<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사이트별 정산 현황</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: '맑은 고딕', Malgun Gothic, sans-serif; font-size: 13px; background: #f5f5f5; padding: 20px; }
  .container { background: #fff; padding: 16px; max-width: 1200px; margin: 0 auto; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .title-row { color: #c00; font-weight: bold; font-size: 13px; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #ccc; padding: 5px 8px; text-align: center; white-space: nowrap; }
  th { background: #e8f0e8; font-weight: bold; font-size: 13px; }
  td:first-child { text-align: center; background: #fff; }
  tr:hover td { background: #f9f9f9; }
  .neg { color: #c00; }
  .pos { color: #000; }
  .subtotal { background: #e8f0e8 !important; font-weight: bold; }
  .subtotal td { background: #e8f0e8 !important; }
  .total-row td { background: #d0d0d0 !important; font-weight: bold; }
  .section-label { font-size: 11px; color: #555; }
  .last-update { font-size: 12px; color: #555; margin-bottom: 6px; }
  .loading { text-align: center; padding: 40px; color: #888; font-size: 16px; }
</style>
</head>
<body>
<div class="container">
  <div class="title-row" id="lastUpdate">로딩 중...</div>
  <div id="tableArea" class="loading">데이터를 불러오는 중입니다...</div>
</div>

<script>
// ── 설정 ──────────────────────────────────────────────
const DATA_URL = './data.json'; // 데이터 파일 경로
const SITES = ['아바', '씨오디', '위너', 'DR.BET'];

// ── 행 정의 ────────────────────────────────────────────
const ROWS = [

  { key: 'sb888_sim',     label: 'SB888(심리스)',            group: 'sports' },
  { key: 'sports',        label: '스포츠',                  group: 'sports' },

  { key: 'slot_prag',     label: '[슬롯] 프레그매틱',        group: 'casino' },
  { key: 'slot_etc',      label: '[슬롯] 프레그매틱 제외',   group: 'casino' },
  { key: 'mini_sprite',   label: '[미니게임] 스프라이브',    group: 'casino' },

  { key: 'virtual_fee',   label: '가상계좌 수수료:',         group: 'bonus' },
  { key: 'casino_roll_total', label: '* 카지노 롤링 총 합계', subtotal: true },
  { key: 'site_total',    label: '사이트별 총 승패',         total: true },
  { key: 'balance',       label: '보유금액',                group: 'balance' },
  { key: 'bank',          label: '통장금액',                group: 'balance' },
  { key: 'manual_bonus',  label: '수기지급 보너스',          group: 'balance' },
];

function fmt(v) {
  if (v === undefined || v === null || v === '') return '0';
  const n = Number(v);
  if (isNaN(n)) return v;
  return n.toLocaleString('ko-KR');
}

function cls(v) {
  const n = Number(v);
  return n < 0 ? 'neg' : 'pos';
}

function renderTable(data) {
  // 날짜 업데이트
  const ts = data.timestamp || '';
  document.getElementById('lastUpdate').textContent = '*' + ts + ' (한국시간)';

  const sites = data.sites || SITES;
  
  let html = '<table>';
  // 헤더
  html += '<tr><th style="min-width:200px"></th><th>사이트 합계액</th>';
  sites.forEach(s => { html += '<th>' + s + '</th>'; });
  html += '</tr>';

  // 데이터 행
  ROWS.forEach(row => {
    const rowData = data.rows && data.rows[row.key] ? data.rows[row.key] : {};
    const total = rowData.total !== undefined ? rowData.total : '';
    
    let trClass = '';
    if (row.subtotal) trClass = 'subtotal';
    if (row.total) trClass = 'total-row';

    html += '<tr class="' + trClass + '">';
    html += '<td>' + row.label + '</td>';
    html += '<td class="' + cls(total) + '">' + fmt(total) + '</td>';
    
    sites.forEach(s => {
      const v = rowData[s] !== undefined ? rowData[s] : '';
      html += '<td class="' + cls(v) + '">' + fmt(v) + '</td>';
    });
    html += '</tr>';
  });

  html += '</table>';
  document.getElementById('tableArea').innerHTML = html;
  document.getElementById('tableArea').className = '';
}

    sports_total:  { total: -53546286, '아바': -44265830, '씨오디': -8656456, '위너': -624000, 'DR.BET': 0 },

};

// 실제 data.json 로드 시도, 실패하면 샘플 데이터 사용
fetch(DATA_URL + '?t=' + Date.now())
  .then(r => r.ok ? r.json() : Promise.reject('no file'))
  .then(data => renderTable(data))
  .catch(() => renderTable(sampleData));
</script>
</body>
</html>
